<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Swap</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .upload-container {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
        }

        img {
            max-width: 300px;
            margin-top: 10px;
            border: 1px solid #ccc;
        }

        #swapButton {
            padding: 10px 20px;
            cursor: pointer;
        }

        #loading {
            display: none;
            margin-top: 20px;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Face Swap</h1>

    <div class="upload-container">

        <div class="upload-section">
            <h2>Imagem do Usuário</h2>

            <input type="file" id="userImage" accept="image/*">

            <img id="previewUser" src="" style="display:none;">
        </div>

        <div class="upload-section">
            <h2>Imagem Base</h2>

            <img id="targetImage" src="./casa.jpg">
        </div>

    </div>

    <button id="swapButton">
        Realizar Troca de Rosto
    </button>

    <div id="loading">
        Processando...
    </div>

    <hr>

    <div id="resultContainer">

        <h2>Resultado</h2>

        <img id="resultImage" src="" style="display:none;">

    </div>

    <script>

        $("#swapButton").on("click", async function () {

            try {

                const sourceFile = $("#userImage")[0].files[0];

                if (!sourceFile) {
                    alert("Selecione a imagem do usuário.");
                    return;
                }

                $("#loading").show();

                // Carrega a imagem alvo (casa.jpg)
                const targetResponse = await fetch("./casa.jpg");
                const targetBlob = await targetResponse.blob();

                const form = new FormData();

                form.append("source_image", sourceFile);
                form.append("target_image", targetBlob, "casa.jpg");

                form.append("source_url", "");
                form.append("target_url", "");
                form.append("face_index", "0");

                const settings = {
                    async: true,
                    crossDomain: true,
                    url: "https://deepfake-face-swap-ai.p.rapidapi.com/target-face",
                    method: "POST",
                    headers: {
                        'x-rapidapi-key': '1c58adfb6fmsh93515ead27f4648p18b570jsnb9b1c662c703',
                        'x-rapidapi-host': 'deepfake-face-swap-ai.p.rapidapi.com'
                    },
                    processData: false,
                    contentType: false,
                    mimeType: "multipart/form-data",
                    data: form
                };

                $.ajax(settings)

                    .done(function (response) {

                        $("#loading").hide();

                        console.log("Resposta:", response);

                        try {
                            response = JSON.parse(response);
                        } catch (e) { }

                        if (response.image_url) {

                            $("#resultImage")
                                .attr("src", response.image_url)
                                .show();

                        } else if (response.image) {

                            $("#resultImage")
                                .attr("src", response.image)
                                .show();

                        } else {

                            alert("Resposta recebida, mas não encontrei a imagem.");

                            console.log(response);
                        }

                    })

                    .fail(function (xhr) {

                        $("#loading").hide();

                        console.error(xhr);

                        alert("Erro ao processar Face Swap. Veja o console.");

                    });

            }

            catch (erro) {

                $("#loading").hide();

                console.error(erro);

                alert("Erro: " + erro.message);

            }

        });

    </script>

</body>

</html>
